services:
  - type: web
    name: murthy-portfolio-contact-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: murthy-portfolio-contact-db
          property: connectionString
      - key: FRONTEND_ORIGINS
        value: https://murthy-bunny.github.io

databases:
  - name: murthy-portfolio-contact-db
    databaseName: murthy_portfolio
    user: murthy_portfolio
    plan: free
    region: singapore
